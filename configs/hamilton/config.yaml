# Hamilton Playground 配置文件
# 通用符号回归 / ODE 发现 Agent
# 支持两种模式：
#   --agent hamilton      → 原始单 Agent 模式
#   --agent hamilton-gan  → GAN 对抗双 Agent 模式（Solver + Critic）

# ============================================
# LLM 配置
# ============================================
llm:
  openai:
    provider: "openai"
    model: "${GPT_CHAT_MODEL}"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${GPT_BASE_URL}"
    temperature: 0.7
    max_tokens: 16384
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  default: "openai"

# ============================================
# Agent 配置（per-agent 格式）
# ============================================
agents:
  # Solver Agent（生成器）— 发现方程
  hamilton:
    llm: "openai"
    max_turns: 120
    enable_tools: true

    context:
      max_tokens: 200000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 10

    system_prompt_file: "prompts/hamilton_system.txt"
    user_prompt_file: "prompts/hamilton_user.txt"

    # Per-agent skills（只加载需要的，不污染 prompt）
    skills:
      - pysr
      - evo-protocol

    # Per-agent tools
    tools:
      builtin: ["*"]

  # Critic Agent（鉴别器）— GAN 对抗审查
  # 仅在 hamilton-gan 模式下启用
  critic:
    llm: "openai"
    max_turns: 40           # Critic 轻量执行，控制 token 消耗
    enable_tools: true

    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 5

    system_prompt_file: "prompts/critic_system.txt"
    user_prompt_file: "prompts/critic_user.txt"

    # Critic 不需要 PySR，但可以使用 evo-protocol 了解迭代规范
    skills:
      - evo-protocol

    # Critic 有 bash 访问权限（用于运行干预实验脚本）
    # 但无需 use_skill（不做符号回归搜索）
    tools:
      builtin: ["*"]

# ============================================
# Session 配置
# ============================================
session:
  type: "local"

  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 21600
    gpu_devices: null
    cpu_devices: null
    symlinks:
      playground/hamilton/workspace/input: input

# ============================================
# 实验配置
# ============================================
experiment:
  max_rounds: 10            # GAN 模式下建议更多轮次

  # Critic 触发条件（仅 hamilton-gan 模式有效）
  critic:
    round_interval: 5       # 至少每 N 轮触发一次 Critic
    mse_plateau_threshold: 0.01  # MSE 改进 <1% 视为平台期
    mse_plateau_window: 3   # 连续 N 轮检测平台期

# ============================================
# LLM 输出 & 工具调用日志
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

# ============================================
# 日志配置
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true

# ============================================
# 项目配置
# ============================================
project_root: "."
debug: false
