# Hamilton Playground 配置文件（无 PySR）
# 纯代码驱动的方程发现 Agent

# ============================================
# LLM 配置
# ============================================
llm:
  openai:
    provider: "openai"
    model: "gpt-5-chat"
    api_key: "sk-1HEDl1RNtaMQV7TDet0FUA"
    base_url: "https://llm.dp.tech"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  default: "openai"

# ============================================
# Agent 配置
# ============================================
agents:
  hamilton:
    llm: "openai"
    max_turns: 120
    enable_tools: true

    context:
      max_tokens: 200000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 10

    system_prompt_file: "prompts/hamilton_system_no_pysr.txt"
    user_prompt_file: "prompts/hamilton_user.txt"

    # 只保留 evo-protocol，不加载 pysr
    skills:
      - evo-protocol

    tools:
      builtin: ["*"]

  critic:
    llm: "openai"
    max_turns: 80
    enable_tools: true

    context:
      max_tokens: 120000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 8

    system_prompt_file: "prompts/critic_system.txt"
    user_prompt_file: "prompts/critic_user.txt"

    skills:
      - evo-protocol

    tools:
      builtin: ["*"]

# ============================================
# Session 配置
# ============================================
session:
  type: "local"

  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 21600
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

# ============================================
# 实验配置
# ============================================
experiment:
  max_rounds: 3

memory:
  l3:
    enabled: true
    root: "./runs/hamilton_l3"
    top_k: 6
    retrieval_mode: "hybrid"
    promotion_policy: "task_end_only"

critic_policy:
  report_md_name: "critic_report.md"
  report_json_name: "critic_report.json"

completion_policy:
  require_critic_approval: true
  enforce_artifact_updates: true
  enforce_artifact_updates_on_any_finish: true
  enforce_task_contract_evidence: true
  max_hamilton_repair_attempts: 2
  require_trace_update: true
  required_l2_files:
    - "plan.md"
    - "findings.md"
  require_machine_state_update: true
  machine_state_any_of:
    - "variable_memory.json"
    - "routing_state.json"
    - "hypothesis_archive.jsonl"
    - "falsification_log.jsonl"

# ============================================
# LLM 输出 & 工具调用日志
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

# ============================================
# 日志配置
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true

# ============================================
# 项目配置
# ============================================
project_root: "."
debug: false
